<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search Gallery</title>
    <link rel="icon" type="image/x-icon" href="/asset/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"
    />
    <style>
      /* ─── CSS Variables / Themes ─── */
      :root {
        --bg-1: rgba(8, 14, 30, 0.72);
        --bg-2: rgba(18, 28, 70, 0.62);
        --text: #dde3f5;
        --text-muted: #8898c0;
        --card: rgba(14, 22, 50, 0.55);
        --accent: #3b5bdb;
        --accent-glow: rgba(59, 91, 219, 0.35);
        --border: rgba(100, 130, 220, 0.18);
        --sidebar-w: 300px;
        --gap: 10px;
        --radius: 14px;
        --font-display: "Syne", sans-serif;
        --font-body: "DM Sans", sans-serif;
      }
      .theme-deep-purple {
        --bg-1: rgba(20, 6, 40, 0.72);
        --bg-2: rgba(60, 10, 80, 0.55);
        --text: #f0e6ff;
        --text-muted: #a070c0;
        --card: rgba(35, 10, 55, 0.55);
        --accent: #9c4dcc;
        --accent-glow: rgba(156, 77, 204, 0.35);
        --border: rgba(180, 100, 240, 0.18);
      }
      .theme-emerald {
        --bg-1: rgba(6, 28, 14, 0.72);
        --bg-2: rgba(10, 55, 28, 0.55);
        --text: #e0f5e8;
        --text-muted: #60a878;
        --card: rgba(10, 40, 20, 0.55);
        --accent: #2e7d52;
        --accent-glow: rgba(46, 125, 82, 0.35);
        --border: rgba(80, 200, 120, 0.18);
      }
      .theme-crimson {
        --bg-1: rgba(30, 6, 6, 0.72);
        --bg-2: rgba(70, 12, 12, 0.55);
        --text: #ffe6e6;
        --text-muted: #c07070;
        --card: rgba(45, 10, 10, 0.55);
        --accent: #c0392b;
        --accent-glow: rgba(192, 57, 43, 0.35);
        --border: rgba(220, 80, 80, 0.18);
      }

      /* ─── Reset ─── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-body);
        color: var(--text);
        background:
          linear-gradient(135deg, var(--bg-1) 20%, var(--bg-2) 100%),
          url("") center/cover no-repeat fixed;
        background-color: #08101e;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ─── Wallpaper overlay ─── */
      #wallpaper-overlay {
        position: fixed;
        inset: 0;
        background-size: cover;
        background-position: center;
        z-index: 19999;
        pointer-events: none;
        animation:
          zoomIn 1.5s cubic-bezier(0.2, 0.8, 0.4, 1),
          fadeOut 1s ease-in-out 1.3s forwards;
      }
      @keyframes zoomIn {
        from {
          transform: scale(1.12);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes fadeOut {
        to {
          opacity: 0;
          filter: blur(12px);
          z-index: -1;
        }
      }

      /* ─── Fixed Controls (top corners) ─── */
      #theme-switcher {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10000;
      }
      #theme-toggle {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 16px;
        font-family: var(--font-display);
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        cursor: pointer;
        backdrop-filter: blur(12px);
        box-shadow: 0 2px 12px #0004;
        transition: all 0.25s;
      }
      #theme-toggle:hover {
        background: var(--bg-2);
      }
      #theme-options {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        background: var(--card);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px 0;
        box-shadow: 0 8px 28px #0008;
        min-width: 170px;
        overflow: hidden;
      }
      #theme-options div {
        padding: 10px 18px;
        cursor: pointer;
        font-size: 13px;
        color: var(--text);
        transition: background 0.15s;
      }
      #theme-options div:hover {
        background: var(--accent);
        color: #fff;
      }
      #theme-switcher:hover #theme-options {
        display: block;
      }

      #background-changer {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 10000;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #background-filename {
        font-size: 11px;
        color: var(--text-muted);
        background: var(--card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #background-changer button {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        cursor: pointer;
        backdrop-filter: blur(12px);
        box-shadow: 0 2px 10px #0003;
        transition: all 0.25s;
      }
      #background-changer button:hover {
        background: var(--accent);
        color: #fff;
      }

      /* ─── Easter egg ─── */
      .easter {
        position: fixed;
        width: 46px;
        border-radius: 50%;
        z-index: 999;
        bottom: -4px;
        right: -4px;
        object-fit: contain;
        pointer-events: auto;
      }
      .easter img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: contain;
        transition: transform 0.3s ease;
      }
      .easter img:hover {
        transform: scale(1.05) translateY(-50px) translateX(-100px);
      }

      /* ─── LAYOUT ─── */
      /* 
        New layout: sidebar slides in/out as an overlay panel.
        Gallery always takes full width. 
        A floating toolbar at top holds search toggle + page info.
      */

      /* Top floating bar */
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        gap: 10px;
        background: linear-gradient(
          to bottom,
          rgba(8, 14, 30, 0.82) 0%,
          transparent 100%
        );
        pointer-events: none;
      }
      #topbar > * {
        pointer-events: auto;
      }

      #toggle-sidebar-btn {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 16px;
        font-family: var(--font-display);
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        cursor: pointer;
        backdrop-filter: blur(12px);
        box-shadow: 0 2px 10px #0003;
        transition: all 0.25s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #toggle-sidebar-btn:hover {
        background: var(--accent);
        color: #fff;
      }
      #toggle-sidebar-btn .bar-icon {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      #toggle-sidebar-btn .bar-icon span {
        display: block;
        width: 16px;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
        transition: all 0.3s;
      }

      /* Inline search bar in topbar (visible when sidebar closed) */
      #topbar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        transition: opacity 0.2s;
      }
      #topbar-search.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #topbar-input {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 14px;
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--text);
        backdrop-filter: blur(12px);
        outline: none;
        width: 220px;
        transition:
          border-color 0.2s,
          width 0.3s;
      }
      #topbar-input:focus {
        border-color: var(--accent);
        width: 280px;
      }
      #topbar-input::placeholder {
        color: var(--text-muted);
      }
      #topbar-go {
        background: var(--accent);
        border: none;
        border-radius: 10px;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      #topbar-go:hover {
        opacity: 0.85;
      }

      /* Page info pill */
      #page-pill {
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(12px);
        border-radius: 10px;
        padding: 6px 14px;
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
      }
      #page-pill strong {
        color: var(--text);
      }

      /* ─── Sidebar overlay ─── */
      #sidebar-overlay {
        position: fixed;
        inset: 0;
        z-index: 800;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #sidebar-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-w);
        z-index: 900;
        background: var(--card);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        transform: translateX(-100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
        overflow-x: hidden;
      }
      #sidebar.open {
        transform: translateX(0);
      }

      .sidebar-header {
        padding: 18px 20px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--card);
        backdrop-filter: blur(20px);
        z-index: 2;
      }
      .sidebar-header h1 {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
        text-shadow: 0 0 20px var(--accent-glow);
        letter-spacing: -0.3px;
      }
      #close-sidebar {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 20px;
        line-height: 1;
        padding: 4px;
        border-radius: 6px;
        transition: color 0.2s;
      }
      #close-sidebar:hover {
        color: var(--text);
      }

      .sidebar-body {
        padding: 14px;
        flex: 1;
      }

      /* Search box inside sidebar */
      .s-search-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
      }
      .s-input {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-2);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      .s-input:focus {
        border-color: var(--accent);
      }
      .s-input::placeholder {
        color: var(--text-muted);
      }
      .s-btn-row {
        display: flex;
        gap: 8px;
      }
      .s-btn {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-family: var(--font-display);
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .s-btn:hover {
        opacity: 0.85;
      }
      .s-btn.secondary {
        background: var(--bg-2);
        border: 1px solid var(--border);
        flex: 0 0 44px;
      }
      .s-btn img {
        width: 14px;
        height: 14px;
      }

      /* Tags suggestions */
      #tagsContainer {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .tag {
        padding: 4px 10px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .tag:hover,
      .tag.selected {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* Divider */
      .s-divider {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
        color: var(--text-muted);
        font-size: 11px;
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .s-divider::before,
      .s-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* Site selector */
      .site-selector {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 4px;
      }
      .site-button {
        padding: 9px 8px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg-2);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }
      .site-button.active,
      .site-button:hover {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* Rating buttons */
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .rating-button {
        flex: 1 0 calc(33% - 4px);
        padding: 9px 4px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: var(--bg-2);
        color: var(--text);
        font-size: 11px;
        font-family: var(--font-body);
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        white-space: nowrap;
      }
      .rating-button:hover {
        background: var(--accent);
        color: #fff;
      }
      .rating-button.active {
        background: var(--accent);
        color: #fff;
      }
      .rating-button[data-rating="g"] {
        box-shadow: inset 0 0 0 1px #00ffcc44;
      }
      .rating-button[data-rating="s"] {
        box-shadow: inset 0 0 0 1px #00ff6644;
      }
      .rating-button[data-rating="q"] {
        box-shadow: inset 0 0 0 1px #ffcc0044;
      }
      .rating-button[data-rating="e"] {
        box-shadow: inset 0 0 0 1px #ff336644;
      }
      .rating-button[data-rating="all"] {
        box-shadow: inset 0 0 0 1px #3399ff44;
      }

      /* ─── GALLERY ─── */
      #gallery-wrap {
        width: 100%;
        padding-top: 56px; /* topbar height */
        padding-bottom: 72px; /* pagination height */
      }

      .container {
        columns: 5 180px;
        column-gap: var(--gap);
        padding: var(--gap);
        width: 100%;
      }

      .img-wrapper {
        break-inside: avoid;
        margin-bottom: var(--gap);
        position: relative;
        display: block;
        cursor: pointer;
        border-radius: var(--radius);
        overflow: hidden;
        transition:
          transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
          box-shadow 0.35s ease;
        will-change: transform;
      }
      .img-wrapper:hover {
        transform: scale(1.03) translateY(-4px);
        box-shadow:
          0 12px 40px var(--accent-glow),
          0 4px 16px #0008;
        z-index: 10;
      }

      .gallery-img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: var(--radius);
        background: var(--card);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .gallery-img.loaded {
        opacity: 1;
      }

      /* Skeleton */
      .img-skeleton {
        position: absolute;
        inset: 0;
        background: var(--card);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .img-skeleton::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 25%,
          rgba(100, 130, 220, 0.18) 50%,
          transparent 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }
      @keyframes shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }

      /* Badges */
      .resolution-badge,
      .video-badge {
        position: absolute;
        z-index: 4;
        background: rgba(8, 14, 30, 0.7);
        backdrop-filter: blur(6px);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 3px 8px;
        border-radius: 7px;
        font-family: var(--font-display);
        font-size: 11px;
        font-weight: 700;
        pointer-events: none;
      }
      .resolution-badge {
        top: 7px;
        left: 7px;
      }
      .video-badge {
        top: 7px;
        right: 7px;
      }

      /* Hover overlay on image */
      .img-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(8, 14, 30, 0.75) 0%,
          transparent 55%
        );
        border-radius: var(--radius);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      .img-wrapper:hover .img-overlay {
        opacity: 1;
      }

      /* Tag tooltip */
      #imageTooltip {
        position: fixed;
        pointer-events: none;
        background: var(--card);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 11px;
        font-size: 12px;
        max-width: 320px;
        white-space: normal;
        word-break: break-word;
        z-index: 999999;
        display: none;
        line-height: 1.45;
        box-shadow: 0 8px 28px #0008;
      }

      /* ─── Pagination (fixed bottom bar) ─── */
      #pagination {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 600;
        background: var(--card);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 20px;
        box-shadow: 0 4px 24px #0005;
      }
      .page-button {
        padding: 7px 16px;
        border-radius: 9px;
        border: none;
        background: var(--bg-2);
        color: var(--text);
        font-family: var(--font-display);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .page-button:hover:not(.disabled) {
        background: var(--accent);
        color: #fff;
      }
      .page-button.disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      #pageInfob {
        font-size: 12px;
        color: var(--text-muted);
      }

      /* ─── Loading / Error ─── */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 50vh;
      }
      .loading img {
        width: 40px;
        height: 40px;
      }
      .error {
        text-align: center;
        color: var(--text-muted);
        padding: 60px 20px;
        font-size: 15px;
      }

      /* ─── Message box ─── */
      .message-box {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 40px #0008;
        z-index: 20000;
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-width: 240px;
      }
      .message-box.visible {
        display: flex;
      }
      .message-box-text {
        margin-bottom: 16px;
        font-size: 14px;
        line-height: 1.5;
      }
      .message-box-button {
        padding: 8px 24px;
        border-radius: 9px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .message-box-button:hover {
        opacity: 0.85;
      }

      /* ─── Fancybox overrides ─── */
      .fancybox__container {
        --fancybox-bg: rgba(5, 10, 22, 0.97);
        --fancybox-color: #dde3f5;
      }
      .fancybox__image {
        max-width: 92vw !important;
        max-height: 88vh !important;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      }
      .fancybox__caption {
        background: rgba(14, 22, 50, 0.9);
        color: var(--text);
        padding: 10px 18px;
        font-size: 12px;
        max-width: 66%;
        margin: 12px auto 0;
        border-radius: 10px;
        text-align: center;
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
      }
      .fancybox__button {
        background: rgba(59, 91, 219, 0.7);
        border-radius: 8px;
        transition: all 0.2s;
      }
      .fancybox__button:hover {
        background: rgba(59, 91, 219, 1);
        transform: scale(1.08);
      }

    <!-- Message box -->
    <div id="messageBox" class="message-box">
      <div id="messageText" class="message-box-text"></div>
      <button id="messageCloseButton" class="message-box-button">OK</button>
    </div>

    <script>
      /* ─── Background images ─── */
      const backgroundImages = [];
      const max = 15,
        letters = ["", "a", "b", "c", "d", "e", "f", "g", "h"];
      for (let i = 0; i < max; i++) {
        backgroundImages.push(
          `./asset/bgs/${(i % 9) + 1}${letters[Math.floor(i / 9)]}.webp`,
        );
      }
      let currentBackgroundIndex = 0;

      function preloadBackgroundImages() {
        backgroundImages.forEach((url) => {
          const i = new Image();
          i.src = url;
        });
      }
      function setRandomBackground() {
        let img;
        do {
          img =
            backgroundImages[
              Math.floor(Math.random() * backgroundImages.length)
            ];
        } while (
          img === localStorage.getItem("lastBackground") &&
          backgroundImages.length > 1
        );
        localStorage.setItem("lastBackground", img);
        applyBackground(img);
      }
      function applyBackground(url) {
        document.getElementById("wallpaper-overlay").style.backgroundImage =
          `url('${url}')`;
        document.body.style.backgroundImage = `
          linear-gradient(135deg, rgba(8,14,30,0.6) 0%, rgba(18,28,70,0.55) 100%),
          url('${url}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundAttachment = "fixed";
        document.body.style.backgroundPosition = "center";
        const fn = url.split("/").pop();
        document.getElementById("background-filename").textContent = fn;
        currentBackgroundIndex = backgroundImages.indexOf(url);
        if (currentBackgroundIndex < 0) currentBackgroundIndex = 0;
      }
      function changeBackground(dir) {
        if (dir === "next")
          currentBackgroundIndex =
            (currentBackgroundIndex + 1) % backgroundImages.length;
        else
          currentBackgroundIndex =
            (currentBackgroundIndex - 1 + backgroundImages.length) %
            backgroundImages.length;
        const url = backgroundImages[currentBackgroundIndex];
        localStorage.setItem("lastBackground", url);
        applyBackground(url);
        const ov = document.getElementById("wallpaper-overlay");
        ov.style.backgroundImage = `url('${url}')`;
        ov.style.animation = "none";
        ov.offsetHeight; // reflow
        ov.style.animation =
          "zoomIn 1.5s cubic-bezier(0.2,0.8,0.4,1), fadeOut 1s ease-in-out 1.3s forwards";
      }
      document
        .getElementById("prev-background")
        .addEventListener("click", () => changeBackground("prev"));
      document
        .getElementById("next-background")
        .addEventListener("click", () => changeBackground("next"));

      /* ─── Theme ─── */
      document.querySelectorAll("#theme-options div").forEach((opt) => {
        opt.addEventListener("click", () => {
          const t = opt.dataset.theme;
          document.body.className = document.body.className
            .replace(/theme-\S+/g, "")
            .trim();
          if (t !== "default") document.body.classList.add(`theme-${t}`);
          localStorage.setItem("theme", t);
        });
      });

      /* ─── Sidebar toggle ─── */
      const sidebar = document.getElementById("sidebar");
      const sidebarOverlay = document.getElementById("sidebar-overlay");
      const topbarSearch = document.getElementById("topbar-search");

      function openSidebar() {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("visible");
        topbarSearch.classList.add("hidden");
        document.getElementById("searchInput").focus();
      }
      function closeSidebar() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("visible");
        topbarSearch.classList.remove("hidden");
      }
      document
        .getElementById("toggle-sidebar-btn")
        .addEventListener("click", () => {
          sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
        });
      document
        .getElementById("close-sidebar")
        .addEventListener("click", closeSidebar);
      sidebarOverlay.addEventListener("click", closeSidebar);

      /* Topbar quick search syncs with sidebar input */
      const topbarInput = document.getElementById("topbar-input");
      const searchInput = document.getElementById("searchInput");
      topbarInput.addEventListener("input", () => {
        searchInput.value = topbarInput.value;
      });
      searchInput.addEventListener("input", () => {
        topbarInput.value = searchInput.value;
      });
      document.getElementById("topbar-go").addEventListener("click", () => {
        webPage = 1;
        apiPage = 1;
        performSearch();
      });
      topbarInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          webPage = 1;
          apiPage = 1;
          performSearch();
        }
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          webPage = 1;
          apiPage = 1;
          performSearch();
          closeSidebar();
        }
      });

      /* ─── State ─── */
      let currentSite = "danbooru",
        currentRating = "g";
      let searchResults = [],
        apiPage = 1,
        webPage = 1,
        resultsPerPage = 50;
      let allTags = [];

      /* ─── DOM refs ─── */
      const searchButton = document.getElementById("searchButton");
      const refreshButton = document.getElementById("refreshButton");
      const tagsContainer = document.getElementById("tagsContainer");
      const imageContainer = document.getElementById("imageContainer");
      const prevPageButton = document.getElementById("prevPage");
      const nextPageButton = document.getElementById("nextPage");
      const pageInfob = document.getElementById("pageInfob");
      const pillApi = document.getElementById("pill-api");
      const pillPage = document.getElementById("pill-page");
      const messageBox = document.getElementById("messageBox");
      const messageText = document.getElementById("messageText");
      const messageCloseButton = document.getElementById("messageCloseButton");

      function showMessage(msg) {
        messageText.textContent = msg;
        messageBox.classList.add("visible");
      }
      messageCloseButton.addEventListener("click", () =>
        messageBox.classList.remove("visible"),
      );

      function debounce(fn, ms) {
        let t;
        return function (...a) {
          clearTimeout(t);
          t = setTimeout(() => fn.apply(this, a), ms);
        };
      }

      /* ─── Tag loading ─── */
      async function loadTags() {
        try {
          const r = await fetch("./tags.json");
          if (!r.ok) return;
          const data = await r.json();
          allTags = Array.isArray(data)
            ? data.filter((t) => t?.name && t?.post_count)
            : [];
          window.tagMap = {};
          allTags.forEach((t) => {
            window.tagMap[t.name] = t.post_count;
          });
        } catch (e) {
          allTags = [];
        }
      }

      function fetchTags(term) {
        if (!term || term.length < 1) return [];
        const last = term.trim().split(" ").pop();
        return allTags
          .filter((t) => t?.name?.includes(last))
          .sort((a, b) => b.post_count - a.post_count)
          .slice(0, 20)
          .map((t) => t.name);
      }

      function showTagSuggestions(suggestions) {
        tagsContainer.innerHTML = "";
        suggestions.forEach((tag) => {
          const el = document.createElement("div");
          el.className = "tag";
          el.textContent = tag;
          el.addEventListener("click", () => fillSearchBar(tag));
          tagsContainer.appendChild(el);
        });
      }

      function fillSearchBar(tag) {
        const parts = searchInput.value.trim().split(" ");
        if (parts.length > 0 && parts[parts.length - 1] !== "")
          parts[parts.length - 1] = tag;
        else parts.push(tag);
        const val = parts.join(" ") + " ";
        searchInput.value = val;
        topbarInput.value = val;
        searchInput.focus();
        tagsContainer.innerHTML = "";
      }

      searchInput.addEventListener(
        "input",
        debounce(async (e) => {
          const last = e.target.value.trim().split(" ").pop();
          if (last && last.length > 1) showTagSuggestions(fetchTags(last));
          else tagsContainer.innerHTML = "";
        }, 400),
      );

      /* ─── Proxy fetch with multi-strategy fallback ─── */
      const PROXY_MY = (url) =>
        `https://api-olive-gamma.vercel.app/api/proxy?url=${encodeURIComponent(url)}`;
      const PROXY_CORS = (url) =>
        `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
      const PROXY_ALLORIGINS = (url) =>
        `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

      async function fetchWithFallback(targetUrl, site) {
        const proxies = [PROXY_MY, PROXY_CORS, PROXY_ALLORIGINS];
        const names = ["Your Vercel proxy", "corsproxy.io", "allorigins.win"];
        // Gelbooru needs a longer timeout — their CDN can be slow
        const timeout = site === "gelbooru" ? 14000 : 9000;

        for (let i = 0; i < proxies.length; i++) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            const r = await fetch(proxies[i](targetUrl), {
              signal: controller.signal,
            });
            clearTimeout(timer);
            if (!r.ok) {
              console.warn(names[i], "returned", r.status);
              continue;
            }
            const data = await r.json();
            // allorigins wraps body in { contents: "..." }
            const parsed = data?.contents ? JSON.parse(data.contents) : data;
            console.info("Fetched via", names[i]);
            return parsed;
          } catch (e) {
            console.warn(names[i], "failed:", e.message);
          }
        }

        if (site === "gelbooru") {
          throw new Error(
            "Gelbooru blocked all 3 proxy attempts. " +
              "Gelbooru enforces strict CORS/ORB policies. " +
              "Fix: add Referer + User-Agent headers on your Vercel proxy, or use a server-side fetch.",
          );
        }
        throw new Error(
          "All proxy strategies failed. Check your network or proxy server.",
        );
      }

      /* ─── Search ─── */
      async function performSearch() {
        const tags = searchInput.value.trim().split(" ").filter(Boolean);
        if (!tags.length) {
          showMessage("Please enter at least one tag.");
          return;
        }

        imageContainer.innerHTML =
          '<div class="loading"><img src="./asset/loading.svg" alt="Loading…" /></div>';

        try {
          let searchTags = [...tags];
          if (currentRating !== "all")
            searchTags.push(`rating:${currentRating}`);

          const endpoints = {
            danbooru: `https://danbooru.donmai.us/posts.json?tags=${encodeURIComponent(searchTags.join(" "))}&page=${apiPage}&limit=100`,
            yandere: `https://yande.re/post.json?tags=${encodeURIComponent(searchTags.join(" "))}&page=${apiPage}&limit=100`,
            gelbooru: `https://gelbooru.com/index.php?page=dapi&s=post&q=index&json=1&tags=${encodeURIComponent(searchTags.join(" "))}&pid=${apiPage - 1}&limit=100&api_key=ceea44488795b1cc07ecaa6102e923f9599e279b86553c59a0936a126a92a381c6290893894f5ebe752584d148523738317d56c90dd39cb84b5bcb647b9d3f1e&user_id=1937005`,
            kona: `https://konachan.net/post.json?tags=${encodeURIComponent(searchTags.join(" "))}&limit=100&page=${apiPage}`,
          };

          const raw = await fetchWithFallback(
            endpoints[currentSite],
            currentSite,
          );

          searchResults = normalizeResults(raw, currentSite);
          searchResults.sort((a, b) => (b.score || 0) - (a.score || 0));
          renderImages();
          updatePagination();
        } catch (err) {
          imageContainer.innerHTML =
            '<div class="error">Error loading images. Please try again.</div>';
          showMessage("Search failed: " + err.message);
        }
      }

      async function loadReq() {
        try {
          currentSite = "danbooru";
          let tags = "-furry+-futanari";
          if (currentRating !== "all") tags += `+rating:${currentRating}`;
          else tags += "+rating:g";
          const apiUrl = `https://danbooru.donmai.us/posts.json?tags=${tags}&page=${apiPage}&limit=100`;
          const raw = await fetchWithFallback(apiUrl, "danbooru");
          searchResults = normalizeResults(raw, "danbooru");
          searchResults.sort((a, b) => (b.score || 0) - (a.score || 0));
          renderImages();
          updatePagination();
        } catch (e) {
          console.error("Initial load failed:", e);
        }
      }

      /* ─── Normalize ─── */
      function normalizeResults(results, site) {
        if (site === "danbooru")
          return results.map((p) => ({
            id: p.id,
            file_url: p.file_url,
            preview_url: p.preview_file_url || p.large_file_url || p.file_url,
            sample_url: p.large_file_url || p.file_url,
            image_width: p.image_width,
            image_height: p.image_height,
            tags: p.tag_string,
            rating: p.rating,
            score: p.score,
            duration: p.media_asset?.duration,
          }));
        if (site === "gelbooru")
          return (results.post || []).map((p) => ({
            id: p.id,
            file_url: p.file_url,
            preview_url: p.preview_url || p.sample_url || p.file_url,
            sample_url: p.sample_url || p.file_url,
            image_width: p.width,
            image_height: p.height,
            tags: p.tags,
            rating: p.rating,
            score: p.score,
          }));
        return results.map((p) => ({
          id: p.id,
          file_url: p.file_url,
          preview_url: p.preview_url || p.sample_url || p.file_url,
          sample_url: p.sample_url || p.file_url,
          image_width: p.width,
          image_height: p.height,
          tags: p.tags,
          rating: p.rating,
          score: p.score,
        }));
      }

      /* ─── Render ─── */
      function formatDuration(s) {
        if (!s || s <= 0) return "0:00";
        return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      }

      function renderImages() {
        imageContainer.innerHTML = "";
        if (!searchResults.length) {
          imageContainer.innerHTML =
            '<div class="error">No results found.</div>';
          return;
        }
        const slice = searchResults.slice(
          (webPage - 1) * resultsPerPage,
          webPage * resultsPerPage,
        );

        // Use DocumentFragment for performance
        const frag = document.createDocumentFragment();

        slice.forEach((post) => {
          const isVideo =
            post.file_url &&
            (post.file_url.endsWith(".mp4") ||
              post.file_url.endsWith(".webm") ||
              post.file_url.includes("video"));

          // For Gelbooru: prefer preview_url (smaller, less likely hotlink-blocked),
          // then proxy the image URL through the same proxy to bypass Referer/CORS checks.
          let previewUrl;
          if (isVideo) {
            previewUrl = post.preview_url;
          } else if (currentSite === "gelbooru") {
            const rawUrl = post.preview_url || post.sample_url || post.file_url;
            previewUrl = rawUrl ? PROXY_MY(rawUrl) : rawUrl;
          } else if (currentSite === "yandere") {
            previewUrl = post.preview_url;
          } else {
            previewUrl = post.sample_url || post.preview_url || post.file_url;
          }

          const wrap = document.createElement("div");
          wrap.className = "img-wrapper";

          let resBadge = "";
          if (post.image_width && post.image_height) {
            const mx = Math.max(post.image_width, post.image_height);
            if (mx >= 7680) resBadge = "8K";
            else if (mx >= 5760) resBadge = "6K";
            else if (mx >= 4320) resBadge = "5K";
            else if (mx >= 3840) resBadge = "4K";
            else if (mx >= 2880) resBadge = "3K";
            else if (mx >= 1920) resBadge = "2K";
            else if (mx >= 1280) resBadge = "HD";
            if (resBadge)
              resBadge = `<div class="resolution-badge">${resBadge}</div>`;
          }
          const vidBadge =
            isVideo && post.duration
              ? `<div class="video-badge">▶ ${formatDuration(post.duration)}</div>`
              : "";

          wrap.innerHTML = `
            <div class="img-skeleton"></div>
            ${resBadge}${vidBadge}
            <div class="img-overlay"></div>
            <img src="${previewUrl}"
              alt="result"
              class="gallery-img"
              loading="lazy"
              data-id="${post.id}"
              data-full-url="${post.file_url || ""}"
              data-tags="${(post.tags || "").substring(0, 500)}"
              data-is-video="${isVideo}">
          `;

          const img = wrap.querySelector("img");
          img.addEventListener("load", function () {
            this.classList.add("loaded");
            wrap.querySelector(".img-skeleton")?.remove();
          });
          img.addEventListener("error", function () {
            wrap.querySelector(".img-skeleton")?.remove();
            // If the image fails (especially Gelbooru), try the plain preview_url as last resort
            if (
              currentSite === "gelbooru" &&
              this.src !== (post.preview_url || "")
            ) {
              this.src = post.preview_url || post.sample_url || "";
            } else {
              this.style.opacity = "0.3";
            }
          });

          // Tooltip (desktop only)
          if (window.matchMedia("(pointer:fine)").matches) {
            const tooltip = document.getElementById("imageTooltip");
            img.addEventListener("mouseenter", function () {
              const tags = (this.dataset.tags || "").split(" ").filter(Boolean);
              const sorted = [...tags]
                .sort(
                  (a, b) =>
                    (window.tagMap?.[b] || 0) - (window.tagMap?.[a] || 0),
                )
                .slice(0, 20);
              tooltip.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:4px;">${sorted
                .map(
                  (
                    t,
                  ) => `<span style="background:rgba(100,130,220,0.2);border:1px solid rgba(255,255,255,0.1);
                  padding:2px 7px;border-radius:5px;font-size:11px;">${t}</span>`,
                )
                .join(
                  "",
                )}${tags.length > 20 ? `<span style="font-size:10px;color:var(--text-muted);align-self:center;">+${tags.length - 20} more</span>` : ""}</div>`;
              tooltip.style.display = "block";
            });
            img.addEventListener("mousemove", function (e) {
              tooltip.style.left = e.clientX + 16 + "px";
              tooltip.style.top = e.clientY + 16 + "px";
            });
            img.addEventListener("mouseleave", function () {
              tooltip.style.display = "none";
            });
          }

          // Click → Fancybox
          wrap.addEventListener("click", (e) => {
            e.preventDefault();
            const rawFullUrl = post.file_url;
            // For Gelbooru: proxy the full-size image URL too, to bypass hotlink protection
            const fullUrl =
              currentSite === "gelbooru" && rawFullUrl
                ? PROXY_MY(rawFullUrl)
                : rawFullUrl;
            const isVid =
              rawFullUrl &&
              (rawFullUrl.endsWith(".mp4") ||
                rawFullUrl.endsWith(".webm") ||
                rawFullUrl.includes("video"));
            const opts = {
              infinite: false,
              Toolbar: { display: { left: [], middle: [], right: ["close"] } },
              Thumbs: false,
              preload: 0,
              on: {
                // Fix: move focus out of the container BEFORE Fancybox sets
                // aria-hidden="true" during the closing animation, which would
                // trap focus inside a hidden element and trigger a browser warning.
                closing: (fancybox) => {
                  const container = fancybox.container;
                  if (container && container.contains(document.activeElement)) {
                    document.activeElement.blur();
                  }
                },
                destroy: () => {
                  document.getElementById("background-changer").style.display =
                    "";
                  document.getElementById("theme-switcher").style.display = "";
                  document.getElementById("pagination").style.display = "";
                },
              },
            };
            document.getElementById("background-changer").style.display =
              "none";
            document.getElementById("theme-switcher").style.display = "none";
            document.getElementById("pagination").style.display = "none";

            if (isVid) {
              opts.Video = { autoStart: false, showControls: true, volume: 1 };
              Fancybox.show(
                [
                  {
                    src: fullUrl,
                    type: "html5video",
                    caption: post.tags
                      ? `Tags: ${post.tags.split(" ").slice(0, 15).join(", ")}…`
                      : "",
                    html5video: { preload: true },
                  },
                ],
                opts,
              );
            } else {
              opts.Images = { zoom: true, initialSize: "fit" };
              Fancybox.show(
                [
                  {
                    src: fullUrl,
                    type: "image",
                    caption: post.tags
                      ? `Tags: ${post.tags.split(" ").slice(0, 15).join(", ")}…`
                      : "",
                  },
                ],
                opts,
              );
            }
          });

          frag.appendChild(wrap);
        });

        imageContainer.appendChild(frag);
        // Scroll to top of gallery
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      /* ─── Pagination ─── */
      function updatePagination() {
        const total = Math.ceil(searchResults.length / resultsPerPage) || 1;
        pageInfob.textContent = `${webPage} / ${total}`;
        pillApi.textContent = `API ${apiPage}`;
        pillPage.textContent = `p${webPage}/${total}`;

        const atStart = webPage <= 1 && apiPage <= 1;
        const atEnd = webPage >= total && searchResults.length < 100;
        prevPageButton.disabled = atStart;
        nextPageButton.disabled = atEnd;
        prevPageButton.classList.toggle("disabled", atStart);
        nextPageButton.classList.toggle("disabled", atEnd);
      }

      prevPageButton.addEventListener("click", () => {
        if (webPage > 1) {
          webPage--;
          renderImages();
          updatePagination();
        } else if (apiPage > 1) {
          apiPage--;
          webPage = 1;
          performSearch();
        }
      });
      nextPageButton.addEventListener("click", () => {
        const total = Math.ceil(searchResults.length / resultsPerPage);
        if (webPage < total) {
          webPage++;
          renderImages();
          updatePagination();
        } else {
          apiPage++;
          webPage = 1;
          performSearch();
        }
      });

      /* ─── Site / Rating selectors ─── */
      document.querySelectorAll(".site-button").forEach((btn) => {
        btn.addEventListener("click", function () {
          document
            .querySelectorAll(".site-button")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          currentSite = this.dataset.site;
          if (searchInput.value.trim()) {
            webPage = 1;
            performSearch();
          }
        });
      });
      document.querySelectorAll(".rating-button").forEach((btn) => {
        btn.addEventListener("click", function () {
          document
            .querySelectorAll(".rating-button")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          currentRating = this.dataset.rating;
          if (searchInput.value.trim()) {
            webPage = 1;
            performSearch();
          }
        });
      });

      searchButton.addEventListener("click", () => {
        webPage = 1;
        apiPage = 1;
        performSearch();
        closeSidebar();
      });
      refreshButton.addEventListener("click", () => {
        apiPage = Math.floor(Math.random() * 20) + 1;
        webPage = 1;
        if (searchInput.value.trim()) performSearch();
        else loadReq();
      });

      /* ─── Init ─── */
      document.addEventListener("DOMContentLoaded", () => {
        preloadBackgroundImages();
        setRandomBackground();
        loadTags();
        apiPage = Math.floor(Math.random() * 100) + 1;

        const savedTheme = localStorage.getItem("theme") || "default";
        if (savedTheme !== "default")
          document.body.classList.add(`theme-${savedTheme}`);

        loadReq();
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  </body>
</html>
